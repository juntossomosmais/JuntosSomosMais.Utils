services:
  # Single-node replica set: the SimpleHistory.MongoDb integration tests need change streams.
  mongo:
    image: mongo:8.0
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    # mongod 8.0.34 refuses to start on Linux kernel 6.19+ (SERVER-121912). Blocking the rseq syscall lets it start;
    # drop this once mongo:8.0 ships 8.0.35.
    security_opt:
      - seccomp=./docker/mongo-seccomp.json
      - no-new-privileges:true
    healthcheck:
      # Initiates the replica set on the first run, then reports healthy once this node is the primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20

  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ConnectionStrings__ConnectionString: mongodb://mongo:27017/?directConnection=true
    command: [ "./scripts/start-tests.sh" ]

  lint-formatter:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    # Uncomment the following line to run the checker
    # command: [ "./scripts/start-check-formatting.sh" ]
    # Uncomment the following line to run the formatter
    command: [ "./scripts/start-formatter.sh" ]
