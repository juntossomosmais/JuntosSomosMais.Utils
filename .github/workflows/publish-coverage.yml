name: Publish coverage report

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '**/Directory.Build.props'
  workflow_dispatch:

jobs:
  publish-coverage:
    # Pinned to 24.04: ubuntu-latest moved to 26.04 (kernel 7.0), where mongod 8.0.34 refuses to start
    # (SERVER-131779). Move back to ubuntu-latest once the mongo:8.0 image ships 8.0.35.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install all tools
        run: |
          dotnet tool restore
      - name: Start MongoDB replica set (SimpleHistory.MongoDb integration tests)
        run: |
          # Bounded waits: if mongod dies on startup, fail with its logs instead of looping until the job times out.
          wait_for_mongo() {
            for _ in $(seq 60); do
              "$@" > /dev/null 2>&1 && return 0
              sleep 1
            done
            echo "::error::MongoDB was not ready after 60 seconds"
            docker logs mongo
            exit 1
          }
          docker run --detach --name mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          wait_for_mongo docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })"
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          wait_for_mongo docker exec mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"
      - name: Build the project, run all tests and publish to SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_VERSION: ${{ github.sha }}
          SOURCE_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -e
          ./scripts/start-sonarcloud.sh
