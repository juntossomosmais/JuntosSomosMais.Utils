name: Validate PR

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Dockerfile'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install all tools
        run: |
          dotnet tool restore
      - name: Check if the project is well formatted
        run: |
          ./scripts/start-check-formatting.sh
      - name: Start MongoDB replica set (SimpleHistory.MongoDb integration tests)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" > /dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          until docker exec mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done
      - name: Build the project, run all tests, and publish the test results
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
          GITHUB_PR_NUMBER: ${{github.event.pull_request.number}}
        run: |
          set -e
          ./scripts/start-sonarcloud.sh
