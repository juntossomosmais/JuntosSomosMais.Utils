name: Validate PR

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - 'Dockerfile'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install all tools
        run: |
          dotnet tool restore
      - name: Check if the project is well formatted
        run: |
          ./scripts/start-check-formatting.sh
      - name: Start MongoDB replica set (SimpleHistory.MongoDb integration tests)
        run: |
          # Bounded waits: if mongod dies on startup, fail with its logs instead of looping until the job times out.
          # mongosh runs with HOME=/tmp: its default HOME is /data/db, and the files it writes there race with the
          # entrypoint chown of /data/db, which aborts the container when a file disappears mid-chown.
          wait_for_mongo() {
            for _ in $(seq 60); do
              "$@" > /dev/null 2>&1 && return 0
              sleep 1
            done
            echo "::error::MongoDB was not ready after 60 seconds"
            docker logs mongo
            exit 1
          }
          # mongod 8.0.34 refuses to start on Linux kernel 6.19+ (SERVER-121912), which the hosted runners now use.
          # Blocking the rseq syscall lets it start; drop the seccomp profile once mongo:8.0 ships 8.0.35.
          docker run --detach --name mongo --publish 27017:27017 --security-opt seccomp=docker/mongo-seccomp.json \
            mongo:8.0 --replSet rs0 --bind_ip_all
          wait_for_mongo docker exec --env HOME=/tmp mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })"
          docker exec --env HOME=/tmp mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          wait_for_mongo docker exec --env HOME=/tmp mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"
      - name: Build the project, run all tests, and publish the test results
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
          GITHUB_PR_NUMBER: ${{github.event.pull_request.number}}
        run: |
          set -e
          ./scripts/start-sonarcloud.sh
